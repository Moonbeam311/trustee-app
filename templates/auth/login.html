<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Hindsfoot OS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='branding/hindsfoot_os.css') }}">
</head>
<body class="brand-login-main">
  <main class="brand-login-layout">
    <section class="brand-login-logo-panel" aria-label="Hindsfoot OS">
      <img
        class="brand-login-logo"
        src="{{ url_for('static', filename='branding/hindsfoot_os_logo.png') }}"
        alt="Hindsfoot OS"
      >
      <p>Hindsfoot OS</p>
    </section>

    <section class="brand-login-card">
      <h1>Login</h1>

    {% if error %}
      <p class="brand-login-error" role="alert">{{ error }}</p>
    {% endif %}

    {% if error_message %}
      <p class="brand-login-error" role="alert">{{ error_message }}</p>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="_csrf_token" value="{{ wtf_csrf_token() }}">

      <label for="login-username">Username</label>
      <input id="login-username" type="text" name="username" autocomplete="username" required autofocus>

      <label for="login-password">Password</label>
      <input id="login-password" type="password" name="password" autocomplete="current-password" required>

      <div class="password-visibility">
        <input
          id="show-password"
          type="checkbox"
          aria-controls="login-password"
          aria-label="Show password"
        >
        <label for="show-password">Show password</label>
      </div>

      <button type="submit">Login</button>
    </form>

    <p class="brand-login-guide">
      <a href="{{ url_for('guide_page') }}">Open User Guide</a>
    </p>
    {% if config.PERSONAL_FIRM_RECOVERY_ENABLED %}
    <p class="brand-login-guide">
      <a href="{{ url_for('account_recovery') }}">Can’t access your account?</a>
    </p>
    {% endif %}
    </section>
  </main>

  <script>
    (function () {
      var control = document.getElementById("show-password");
      var password = document.getElementById("login-password");
      if (!control || !password) return;

      control.addEventListener("change", function () {
        password.type = control.checked ? "text" : "password";
      });
    }());
  </script>

  {% include "_institutional_property_notice.html" %}
</body>
</html>
